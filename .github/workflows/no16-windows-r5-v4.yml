name: No16 Windows R5 replication v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/no16-windows-r5-v4.yml'
      - 'test_snippet.rs'

permissions:
  contents: read

env:
  TRUSTEE_COMMIT: 512fed65642015b849f38fb13bfdec7806639987
  RUST_TOOLCHAIN: 1.95.0
  TEST_NAME: test_native_inert_revision_binding
  EXPECTED_SNIPPET_SHA256: 1e69a6d7d3eaede9bcd9082ea0a01fd9ad01b0894a7d359c995b3416efe9662d
  EXPECTED_PATCHED_BROKER_SHA256: 0b34df6b20e90625c28555f36930b7502f5f36b08a349de219f232ea29ebad71
  EXPECTED_INJECTION_DIFF_SHA256: 8e5d163d2b5eaf538aea2d73d8585100853cb3b113f316fa8176824a94cdf502
  PROTOC_ARCHIVE_SHA256: 70381b116ab0d71cb6a5177d9b17c7c13415866603a0fd40d513dafe32d56c35
  CARGO_TERM_COLOR: never
  CARGO_HOME: 'C:\c'
  CARGO_TARGET_DIR: 'C:\o'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TRUSTEE: 'C:\t'
  EVIDENCE: 'C:\e'

jobs:
  windows-r5:
    name: Windows Server 2025 exact R5 witness v4
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Checkout evidence repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize short-path evidence environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in @($env:EVIDENCE, $env:TRUSTEE, $env:CARGO_HOME, $env:CARGO_TARGET_DIR)) {
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME | Out-Null
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'failed to enable git long paths' }

          $env:GITHUB_SHA | Set-Content -Path (Join-Path $env:EVIDENCE 'evidence_repo_commit.txt') -Encoding ascii
          Copy-Item '.github/workflows/no16-windows-r5-v4.yml' (Join-Path $env:EVIDENCE 'workflow_source.yml')

          @'
          from pathlib import Path
          import os, subprocess
          out = Path(os.environ['EVIDENCE']) / 'test_snippet.rs'
          with out.open('wb') as f:
              subprocess.run(['git', 'show', f"{os.environ['GITHUB_SHA']}:test_snippet.rs"], stdout=f, check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'failed to extract committed R5 witness blob' }

          $snippet = Join-Path $env:EVIDENCE 'test_snippet.rs'
          $snippetHash = (Get-FileHash $snippet -Algorithm SHA256).Hash.ToLowerInvariant()
          "$snippetHash  test_snippet.rs" | Set-Content -Path (Join-Path $env:EVIDENCE 'test_snippet_sha256.txt') -Encoding ascii
          if ($snippetHash -ne $env:EXPECTED_SNIPPET_SHA256) { throw "R5 snippet byte identity failed: $snippetHash" }

      - name: Record environment and install pinned tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "image_os=windows-2025"
            "image_os_reported=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "os_version=$([Environment]::OSVersion.VersionString)"
            "powershell=$($PSVersionTable.PSVersion)"
            "cargo_home=$env:CARGO_HOME"
            "cargo_target_dir=$env:CARGO_TARGET_DIR"
            "trustee_path=$env:TRUSTEE"
          ) | Set-Content -Path (Join-Path $env:EVIDENCE 'environment.txt') -Encoding utf8
          cmd.exe /c ver 2>&1 | Add-Content -Path (Join-Path $env:EVIDENCE 'environment.txt') -Encoding utf8
          git --version 2>&1 | Set-Content -Path (Join-Path $env:EVIDENCE 'git_version.txt') -Encoding utf8
          python --version 2>&1 | Set-Content -Path (Join-Path $env:EVIDENCE 'python_version.txt') -Encoding utf8
          cmake --version 2>&1 | Set-Content -Path (Join-Path $env:EVIDENCE 'cmake_version.txt') -Encoding utf8
          if (Get-Command openssl -ErrorAction SilentlyContinue) { openssl version -a 2>&1 | Set-Content -Path (Join-Path $env:EVIDENCE 'openssl_version.txt') -Encoding utf8 }
          else { 'not-found' | Set-Content -Path (Join-Path $env:EVIDENCE 'openssl_version.txt') -Encoding ascii }
          if (Get-Command perl -ErrorAction SilentlyContinue) { perl -v 2>&1 | Set-Content -Path (Join-Path $env:EVIDENCE 'perl_version.txt') -Encoding utf8 }
          else { 'not-found' | Set-Content -Path (Join-Path $env:EVIDENCE 'perl_version.txt') -Encoding ascii }
          if (Get-Command nasm -ErrorAction SilentlyContinue) { nasm -v 2>&1 | Set-Content -Path (Join-Path $env:EVIDENCE 'nasm_version.txt') -Encoding utf8 }
          else { 'not-found' | Set-Content -Path (Join-Path $env:EVIDENCE 'nasm_version.txt') -Encoding ascii }

          $zip = Join-Path $env:RUNNER_TEMP 'protoc-31.1-win64.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'protoc-31.1'
          $uri = 'https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-win64.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $archiveHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @("url=$uri", "sha256=$archiveHash", "expected_sha256=$env:PROTOC_ARCHIVE_SHA256") |
            Set-Content -Path (Join-Path $env:EVIDENCE 'protoc_source.txt') -Encoding ascii
          if ($archiveHash -ne $env:PROTOC_ARCHIVE_SHA256) { throw "protoc archive SHA mismatch: $archiveHash" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $protocBin = Join-Path $dir 'bin'
          $protocExe = Join-Path $protocBin 'protoc.exe'
          $protocBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = (& $protocExe --version 2>&1 | Out-String).Trim()
          $version | Set-Content -Path (Join-Path $env:EVIDENCE 'protoc_version.txt') -Encoding ascii
          if ($version -ne 'libprotoc 31.1') { throw "unexpected protoc version: $version" }

          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustc "+$env:RUST_TOOLCHAIN" --version 2>&1 | Set-Content -Path (Join-Path $env:EVIDENCE 'rustc_version.txt') -Encoding utf8
          cargo "+$env:RUST_TOOLCHAIN" --version 2>&1 | Set-Content -Path (Join-Path $env:EVIDENCE 'cargo_version.txt') -Encoding utf8
          rustup show 2>&1 | Set-Content -Path (Join-Path $env:EVIDENCE 'rustup_show.txt') -Encoding utf8
          $rustc = (Get-Content (Join-Path $env:EVIDENCE 'rustc_version.txt') -Raw).Trim()
          $cargo = (Get-Content (Join-Path $env:EVIDENCE 'cargo_version.txt') -Raw).Trim()
          if ($rustc -notmatch '^rustc 1\.95\.0 ') { throw "wrong rustc: $rustc" }
          if ($cargo -notmatch '^cargo 1\.95\.0 ') { throw "wrong cargo: $cargo" }

      - name: Verify MSVC x64 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
          if (-not $vsInstall) { throw 'Visual Studio C++ toolchain not found' }
          $vsDevCmd = Join-Path $vsInstall 'Common7\Tools\VsDevCmd.bat'
          @("vs_install=$vsInstall", "vsdevcmd=$vsDevCmd") | Set-Content -Path (Join-Path $env:EVIDENCE 'msvc_environment.txt') -Encoding utf8
          $cmdLine = "call `"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul && where cl && cl"
          $out = & $env:ComSpec /d /c $cmdLine 2>&1
          $status = $LASTEXITCODE
          $out | Set-Content -Path (Join-Path $env:EVIDENCE 'cl_version.txt') -Encoding utf8
          if ($status -ne 0) { throw "MSVC verification failed: $status" }

      - name: Fresh clone pinned Trustee and inject exact R5 witness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            'clone_command=git -c core.autocrlf=false clone --filter=blob:none https://github.com/confidential-containers/trustee.git C:\t'
            "checkout_command=git checkout --detach $env:TRUSTEE_COMMIT"
          ) | Set-Content -Path (Join-Path $env:EVIDENCE 'provenance.txt') -Encoding ascii
          git -c core.autocrlf=false clone --filter=blob:none https://github.com/confidential-containers/trustee.git $env:TRUSTEE
          if ($LASTEXITCODE -ne 0) { throw 'fresh clone failed' }
          git -C $env:TRUSTEE config core.autocrlf false
          git -C $env:TRUSTEE checkout --detach $env:TRUSTEE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'fixed commit checkout failed' }
          $head = (git -C $env:TRUSTEE rev-parse HEAD).Trim()
          @("head=$head", "fixed_commit=$env:TRUSTEE_COMMIT", "match=$($head -eq $env:TRUSTEE_COMMIT)".ToLowerInvariant()) |
            Set-Content -Path (Join-Path $env:EVIDENCE 'commit.txt') -Encoding ascii
          if ($head -ne $env:TRUSTEE_COMMIT) { throw "wrong HEAD: $head" }
          $before = @(git -C $env:TRUSTEE status --short)
          '' | Set-Content -Path (Join-Path $env:EVIDENCE 'git_status_before.txt') -Encoding utf8
          if ($before.Count -ne 0) {
            $before | Set-Content -Path (Join-Path $env:EVIDENCE 'git_status_before.txt') -Encoding utf8
            throw 'checkout not clean before injection'
          }

          @'
          from pathlib import Path
          import os, re, subprocess
          checkout = Path(os.environ['TRUSTEE'])
          evidence = Path(os.environ['EVIDENCE'])
          broker = checkout / 'attestation-service/src/ear_token/broker.rs'
          snippet = evidence / 'test_snippet.rs'
          source = broker.read_text(encoding='utf-8')
          test_name = os.environ['TEST_NAME']
          if f'fn {test_name}' in source:
              raise SystemExit('test already present before injection')
          if not re.search(r'(?s)#\[cfg\(test\)\]\s*mod tests\s*\{.*\}\s*$', source):
              raise SystemExit('could not locate final tests module')
          test_body = snippet.read_text(encoding='utf-8')
          injected = re.sub(r'\}\s*$', '\n' + test_body + '\n}\n', source)
          broker.write_text(injected, encoding='utf-8', newline='\n')
          with (evidence / 'injection.diff').open('wb') as f:
              subprocess.run(['git', '-C', str(checkout), 'diff', '--', 'attestation-service/src/ear_token/broker.rs'], stdout=f, check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'R5 injection failed' }

          $broker = Join-Path $env:TRUSTEE 'attestation-service/src/ear_token/broker.rs'
          Copy-Item $broker (Join-Path $env:EVIDENCE 'patched_broker.rs')
          $after = @(git -C $env:TRUSTEE status --short)
          $after | Set-Content -Path (Join-Path $env:EVIDENCE 'git_status_after.txt') -Encoding utf8
          if ($after.Count -ne 1 -or $after[0] -notmatch 'attestation-service/src/ear_token/broker\.rs') { throw "unexpected changed files: $($after -join '; ')" }
          $patchedHash = (Get-FileHash $broker -Algorithm SHA256).Hash.ToLowerInvariant()
          $diffHash = (Get-FileHash (Join-Path $env:EVIDENCE 'injection.diff') -Algorithm SHA256).Hash.ToLowerInvariant()
          "$patchedHash  patched_broker.rs" | Set-Content -Path (Join-Path $env:EVIDENCE 'patched_broker_sha256.txt') -Encoding ascii
          "$diffHash  injection.diff" | Set-Content -Path (Join-Path $env:EVIDENCE 'injection_diff_sha256.txt') -Encoding ascii
          if ($patchedHash -ne $env:EXPECTED_PATCHED_BROKER_SHA256) { throw "patched broker differs from Ubuntu R5: $patchedHash" }
          if ($diffHash -ne $env:EXPECTED_INJECTION_DIFF_SHA256) { throw "injection diff differs from Ubuntu R5: $diffHash" }

      - name: Run exact native R5 test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
          $vsDevCmd = Join-Path $vsInstall 'Common7\Tools\VsDevCmd.bat'
          $command = "cargo +$env:RUST_TOOLCHAIN -vv test --locked -p attestation-service --lib $env:TEST_NAME -- --nocapture"
          $command | Set-Content -Path (Join-Path $env:EVIDENCE 'cargo_command.txt') -Encoding ascii
          $log = Join-Path $env:EVIDENCE 'cargo_test.log'
          $cmdLine = "call `"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul && cd /d `"$env:TRUSTEE`" && $command"
          & $env:ComSpec /d /c $cmdLine *> $log
          $cargoStatus = $LASTEXITCODE
          Get-Content $log
          "$cargoStatus" | Set-Content -Path (Join-Path $env:EVIDENCE 'exit_code.txt') -Encoding ascii
          Write-Host "cargo_exit_code=$cargoStatus"
          exit 0

      - name: Apply exact R5 evidence gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import json, os, re, sys
          e = Path(os.environ['EVIDENCE'])
          raw = (e / 'cargo_test.log').read_text(encoding='utf-8', errors='replace')
          log = re.sub(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])', '', raw)
          exit_code = int((e / 'exit_code.txt').read_text().strip())
          commit = (e / 'commit.txt').read_text(encoding='utf-8', errors='replace')
          before = (e / 'git_status_before.txt').read_text(encoding='utf-8', errors='replace')
          after_lines = [x for x in (e / 'git_status_after.txt').read_text(encoding='utf-8', errors='replace').splitlines() if x.strip()]
          snippet_sha = (e / 'test_snippet_sha256.txt').read_text().split()[0]
          patched_sha = (e / 'patched_broker_sha256.txt').read_text().split()[0]
          diff_sha = (e / 'injection_diff_sha256.txt').read_text().split()[0]
          protoc_version = (e / 'protoc_version.txt').read_text().strip()
          ma = re.search(r'(?m)^sha384_a=([0-9a-f]{96})\r?$', log)
          mb = re.search(r'(?m)^sha384_b=([0-9a-f]{96})\r?$', log)
          checks = {
              'head_matches_fixed_commit': 'match=true' in commit.lower(),
              'clean_before_injection': before.strip() == '',
              'only_broker_changed': len(after_lines) == 1 and 'attestation-service/src/ear_token/broker.rs' in after_lines[0].replace('\\', '/'),
              'exact_r5_snippet_sha256': snippet_sha == os.environ['EXPECTED_SNIPPET_SHA256'],
              'patched_broker_byte_identical_to_ubuntu_r5': patched_sha == os.environ['EXPECTED_PATCHED_BROKER_SHA256'],
              'injection_diff_byte_identical_to_ubuntu_r5': diff_sha == os.environ['EXPECTED_INJECTION_DIFF_SHA256'],
              'protoc_31_1_exact': protoc_version == 'libprotoc 31.1',
              'cargo_exit_zero': exit_code == 0,
              'target_test_executed_and_ok': f"test ear_token::broker::tests::{os.environ['TEST_NAME']} ... ok" in log,
              'one_pass_zero_fail': re.search(r'test result: ok\. 1 passed; 0 failed;', log) is not None,
              'sha384_a_present': ma is not None,
              'sha384_b_present': mb is not None,
              'sha384_a_ne_b': ma is not None and mb is not None and ma.group(1) != mb.group(1),
              'same_logical_policy_identity': 'same_logical_policy_identity=true' in log,
              'signature_a_verified': 'signature_a_verified=true' in log,
              'signature_b_verified': 'signature_b_verified=true' in log,
              'digest_a_absent': 'digest_a_absent_from_both_signed_payloads=true' in log,
              'digest_b_absent': 'digest_b_absent_from_both_signed_payloads=true' in log,
              'explicit_policy_hash_paths_a_empty': 'observed_explicit_policy_hash_field_paths_a=[]' in log,
              'explicit_policy_hash_paths_b_empty': 'observed_explicit_policy_hash_field_paths_b=[]' in log,
              'temporal_exclusions_exact': 'temporal_exclusions=iat,exp' in log,
              'normalized_non_temporal_payload_equal': 'normalized_non_temporal_payload_equal=true' in log,
              'r5_marker': 'PASS_NATIVE_INERT_REVISION_BINDING_TEST' in log,
          }
          passed = all(checks.values())
          (e / 'gate_checks.json').write_text(json.dumps(checks, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          lines = [f"{k}={str(v).lower()}" for k, v in checks.items()]
          lines.append(f"final={'PASS' if passed else 'FAIL'}")
          if passed:
              lines.append('NO16_GITHUB_ACTIONS_WINDOWS_R5_PASS')
          (e / 'final_result.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          if not passed:
              sys.exit(1)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Windows R5 evidence gate failed' }

      - name: Build SHA-256 evidence manifest
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:EVIDENCE) {
            $root = [IO.Path]::GetFullPath($env:EVIDENCE)
            $lines = Get-ChildItem -Path $root -File -Recurse |
              Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
              Sort-Object FullName |
              ForEach-Object {
                $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                $rel = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
                "$hash  ./$rel"
              }
            $lines | Set-Content -Path (Join-Path $root 'SHA256SUMS.txt') -Encoding ascii
          }

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NO16_WINDOWS2025_R5_EVIDENCE_V4
          path: ${{ env.EVIDENCE }}
          if-no-files-found: warn
          retention-days: 90
